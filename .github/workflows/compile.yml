name: Compile ESP32-S3 Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v1

      - name: Install ESP32 Platform Core v2.0.14
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.14

      - name: Download USB Host Library
        run: |
          mkdir -p ./libraries
          curl -L -s https://github.com/tobozo/ESP32-USB-Host-MSC/archive/refs/heads/master.zip -o ./msc.zip
          unzip -q ./msc.zip -d ./libraries/
          mv ./libraries/ESP32-USB-Host-MSC-master ./libraries/ESP32-USB-Host-MSC

      - name: Compile Sketch to BIN
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:CDCOnBoot=cdc,USBMode=tinyusb \
            --libraries ./libraries \
            --output-dir ./build \
            --verbose \
            ./esp32-audio-sync

      - name: Upload BIN Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: esp32s3-firmware
          path: ./build/*.bin
